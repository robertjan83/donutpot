name: DONUT OPS Quizmeldingen

on:
  schedule:
    # Every five minutes; GitHub Actions can delay scheduled executions.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: donutops-quiz-push
  cancel-in-progress: false

jobs:
  send-quiz-push:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sender dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Notify subscribers for newly released quiz question
        run: node scripts/send-quiz-push.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
